name: DevOps Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v3

    - name: 2. Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 🔍 NEW LINTING STEP ADDED HERE
    - name: 3. Code Linting (Quality Check)
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 4. Install Dependencies & Run Tests
      run: |
        pip install -r requirements.txt
        pytest

    - name: 5. Build Docker Container Image
      run: |
        docker build -t flask-devops-app:${{ github.sha }} .

    - name: 6. Validate Container Health
      run: |
        docker run -d -p 5000:5000 --name running-app flask-devops-app:${{ github.sha }}
        sleep 5
        curl --fail http://localhost:5000 || exit 1