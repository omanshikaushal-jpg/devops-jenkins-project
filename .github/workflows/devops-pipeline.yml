name: DevOps Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v3

    - name: 2. Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 3. Install Dependencies & Run Tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest

    - name: 4. Build Docker Container Image
      run: |
        docker build -t flask-devops-app:${{ github.sha }} .

    - name: 5. Validate Container Health
      run: |
        docker run -d -p 5000:5000 --name running-app flask-devops-app:${{ github.sha }}
        sleep 5
        curl --fail http://localhost:5000 || exit 1